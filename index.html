<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Diario de Cartas</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Calistoga&family=DM+Serif+Display:ital@0;1&family=Mea+Culpa&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="main-container">
        
        <div class="widgets-section fade-target" id="media-container">
            <div class="media-widget youtube-widget">
                <iframe id="youtube-frame" width="100%" height="230" src="" title="YouTube video player" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="media-widget spotify-widget">
                <iframe id="spotify-frame" style="border-radius:12px" src="" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>
            <div class="media-widget tiktok-widget" id="tiktok-container" style="display: none;">
                <iframe id="tiktok-frame" width="100%" height="580" src="" frameborder="0" allow="encrypted-media;" allowfullscreen></iframe>
            </div>
        </div>

        <div class="letter-column">
            
            <div class="envelope-wrapper fade-target" id="envelope-container">
                <div class="envelope-back"></div>
                
                <div class="letter">
                    <div class="text" id="letter-content"></div>
                    <button id="expand-btn" class="expand-btn" title="Leer en pantalla completa">⛶</button>
                </div>
                
                <div class="envelope-front"></div>
                <div class="envelope-flap"></div>
                <div class="seal-star"><span class="star-icon">✪</span></div>
            </div>

            <div class="emoji-bar fade-target glass-effect" id="emoji-bar">
                <span class="emoji-btn">❤️</span>
                <span class="emoji-btn">✨</span>
                <span class="emoji-btn">🥺</span>
                <span class="emoji-btn">🌻</span>
            </div>

            <div class="comments-section fade-target glass-effect" id="comments-section">
                <h4 class="calistoga-regular">Mensajitos</h4>
                <div id="comments-list" class="comments-list"></div>
                <div class="comment-input-area">
                    <input type="text" id="comment-input" placeholder="Escribe un mensajito..." class="dm-serif-display-regular">
                    <button id="send-comment">➤</button>
                </div>
            </div>

        </div>

        <div class="calendar-section fade-target">
            <div class="calendar glass-effect">
                <div class="calendar-header">
                    <h3 id="month-year" class="dm-serif-display-regular">Mes Año</h3>
                </div>
                <div class="weekdays calistoga-regular">
                    <div>Do</div><div>Lu</div><div>Ma</div><div>Mi</div><div>Ju</div><div>Vi</div><div>Sa</div>
                </div>
                <div class="days playfair-display-regular" id="calendar-days"></div>
            </div>

            <div class="photo-widget glass-effect" id="photo-container" style="display: none;">
                <img id="daily-photo" src="" alt="Recuerdo del día">
            </div>
        </div>
    </main>

    <footer class="verse-container">
        <p class="verse">"Deléitate asimismo en el Señor, y él te concederá las peticiones de tu corazón."</p>
        <p class="reference">— Salmos 37:4</p>
    </footer>

    <button id="open-wordle-btn" class="wordle-float-btn hidden">
        <span class="star-icon">⭐</span>
    </button>

    <div id="letter-modal" class="modal">
        <div class="modal-content glass-effect">
            <button id="close-modal" class="close-btn">✖</button>
            <div id="modal-text-content" class="text"></div>
        </div>
    </div>

    <div id="wordle-modal" class="modal">
        <div class="modal-content wordle-content">
            <button id="close-wordle" class="close-btn close-wordle-btn">✖</button>
            <h2 class="wordle-title calistoga-regular">LA PALABRA DEL DÍA<br><span>PERSONALIZADA</span></h2>
            <div id="wordle-grid" class="wordle-grid"></div>
            <div id="wordle-keyboard" class="wordle-keyboard"></div>
        </div>
    </div>

    <div id="floating-emojis-container" class="floating-emojis-container"></div>
    <div id="flower-shower" class="flower-shower"></div>
    <div id="surprise-toast" class="surprise-toast glass-effect"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
